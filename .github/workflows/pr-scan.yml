# Stage one of two: scan a pull request and emit data only.
#
# THREAT MODEL. This workflow runs on `pull_request`, so for a fork PR it
# executes code the author controls (their Dockerfile, their compose file,
# their build context). It therefore holds NO write permissions and NO access
# to secrets, and it does not comment. It writes the findings to an artifact
# and stops.
#
# Stage two (`pr-comment.yml`) runs on `workflow_run` in the base repository's
# context, where it does have permission to comment, and it reads only that
# artifact - never the PR's code. Rendering happens there.
#
# Splitting it this way is what makes the feature safe on forks. Do not merge
# the two workflows, and do not add `pull_request_target` here: that would run
# the PR's code with the base repo's token, which is the exact vulnerability
# this design avoids.

name: PR scan

on:
  pull_request:
    paths:
      - '**/Dockerfile*'
      - '**/docker-compose*.yml'
      - '**/docker-compose*.yaml'
      - '**/compose*.yml'
      - '**/compose*.yaml'

permissions:
  contents: read

concurrency:
  group: pr-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan changed container files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the pull request
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@e9d6f990972a57673cdb72ec29e19d42ba28880f # v6.0.0
        with:
          python-version: '3.13'

      - name: Install DockSec and Trivy
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install .
          python -m docksec.setup_external_tools

      - name: Scan changed files
        run: .github/scripts/collect_pr_scan.sh "${{ github.base_ref }}" pr-scan

      # The PR number has to travel with the artifact: stage two runs from a
      # workflow_run event and cannot otherwise know which PR to comment on.
      - name: Record the PR number
        run: echo "${{ github.event.pull_request.number }}" > pr-scan/pr-number.txt

      - name: Upload the findings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docksec-pr-scan
          path: pr-scan/
          retention-days: 3
