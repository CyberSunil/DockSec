name: Container Image Smoke Test

# Builds the image that backs the GitHub Action and proves it actually works.
#
# This exists because the image shipped for months with a broken Trivy install:
# the install URL 404'd, `curl -sfL ... | sh` exits 0 on a 404, so the build
# succeeded and produced an image with no Trivy in it. Every Action run then
# failed with "Missing required tools: trivy". A build-success check would not
# have caught it - only running a real scan does.

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'entrypoint.sh'
      - 'action.yml'
      - 'docksec/**'
      - 'pyproject.toml'
      - '.github/workflows/docker-image-smoke.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'entrypoint.sh'
      - 'action.yml'
      - 'docksec/**'
      - 'pyproject.toml'
      - '.github/workflows/docker-image-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Build image and run a real scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Build image
        run: docker build -t docksec:smoke .

      # The Dockerfile asserts these at build time too. Repeated here so a
      # regression is reported as a named test failure rather than an opaque
      # build error, and so the installed versions appear in the CI log.
      - name: Assert bundled tools are present
        run: |
          docker run --rm --entrypoint sh docksec:smoke -c '
            set -e
            trivy --version
            hadolint --version
            docksec --version
          '

      # Regression guard: /github/workspace is where the Action mounts the
      # user's repository. The image used to install itself there, which both
      # shipped DockSec's own source to every user (including the gitignored
      # CLAUDE.md) and left files that the bind mount then shadowed.
      - name: Assert the workspace mount point is empty
        run: |
          entries="$(docker run --rm --entrypoint sh docksec:smoke -c 'ls -A /github/workspace | wc -l')"
          if [ "$entries" -ne 0 ]; then
            echo "::error::/github/workspace is not empty ($entries entries); the image must not ship files into the Action's mount point"
            docker run --rm --entrypoint sh docksec:smoke -c 'ls -A /github/workspace'
            exit 1
          fi

      - name: Assert local-only files are not in the image
        run: |
          for f in CLAUDE.md .cursorrules; do
            if docker run --rm --entrypoint sh docksec:smoke -c "test -e /src/$f -o -e /github/workspace/$f"; then
              echo "::error::$f was copied into the image; it must be excluded by .dockerignore"
              exit 1
            fi
          done

      - name: Create a deliberately vulnerable Dockerfile
        run: |
          mkdir -p smoke-workspace
          cat > smoke-workspace/Dockerfile <<'EOF'
          FROM node:18
          ENV DB_PASSWORD=hunter2supersecret
          WORKDIR /app
          COPY . .
          RUN npm install
          ADD https://example.com/payload.tar.gz /tmp/
          EXPOSE 3306
          CMD ["node","server.js"]
          EOF

      # The core assertion: a scan runs to completion through the Action's own
      # entrypoint and produces findings. Uses --scan-only so no API key is
      # needed; AI analysis is not what this test covers.
      - name: Run a scan through the Action entrypoint
        run: |
          set -o pipefail
          docker run --rm \
            -v "${PWD}/smoke-workspace:/github/workspace" \
            -e INPUT_DOCKERFILE=Dockerfile \
            -e INPUT_SCAN_ONLY=true \
            -e INPUT_FORMAT=json \
            -e INPUT_OUTPUT_DIR=/github/workspace/results \
            docksec:smoke 2>&1 | tee scan-output.txt

      - name: Assert the scan produced a usable report
        run: |
          report="$(find smoke-workspace/results -name '*.json' -print -quit)"
          if [ -z "$report" ]; then
            echo "::error::no JSON report was written; the scan did not complete"
            ls -R smoke-workspace || true
            exit 1
          fi
          echo "Report: $report"
          python3 - "$report" <<'PY'
          import json, sys

          with open(sys.argv[1]) as handle:
              data = json.load(handle)

          # A Dockerfile with a plaintext ENV password must not score well. This
          # catches a scan that "succeeds" while silently finding nothing.
          score = (data.get("scan_info") or {}).get("analysis_score")
          if score is None:
              sys.exit("::error::report has no analysis_score")
          if score > 50:
              sys.exit(f"::error::score {score} is too high for a Dockerfile with a plaintext credential")
          print(f"analysis_score={score} (expected low)")
          PY

      - name: Assert Hadolint actually ran
        run: |
          if ! grep -q 'DL[0-9]\{4\}' scan-output.txt; then
            echo "::error::no Hadolint rule IDs in output; Hadolint did not run or produced nothing"
            cat scan-output.txt
            exit 1
          fi
          echo "Hadolint findings present."

      # Gated on a compose scan rather than the Dockerfile above: --fail-on
      # evaluates structured findings in json_data, and Hadolint output is not
      # yet parsed into that shape, so a Dockerfile-only scan has nothing for
      # the gate to see. Revisit once Hadolint findings are structured.
      - name: Create a vulnerable compose file
        run: |
          cat > smoke-workspace/docker-compose.yml <<'EOF'
          services:
            db:
              image: postgres:16
              privileged: true
              environment:
                - POSTGRES_PASSWORD=supersecret
              ports:
                - "5432:5432"
          EOF

      - name: Assert --fail-on gates the build
        run: |
          set +e
          docker run --rm \
            -v "${PWD}/smoke-workspace:/github/workspace" \
            -e INPUT_COMPOSE=docker-compose.yml \
            -e INPUT_SCAN_ONLY=true \
            -e INPUT_FAIL_ON=critical \
            docksec:smoke >/dev/null 2>&1
          code=$?
          set -e
          # 0 would mean the gate never fired; 2 (usage) or 3 (tool error) mean
          # the run broke rather than gated.
          if [ "$code" -ne 1 ]; then
            echo "::error::expected exit 1 from --fail-on critical, got $code"
            exit 1
          fi
          echo "Gate fired correctly (exit 1)."

      - name: Assert a clean run still exits 0
        run: |
          docker run --rm \
            -v "${PWD}/smoke-workspace:/github/workspace" \
            -e INPUT_COMPOSE=docker-compose.yml \
            -e INPUT_SCAN_ONLY=true \
            docksec:smoke >/dev/null 2>&1
          echo "Ungated run exits 0 as expected."
