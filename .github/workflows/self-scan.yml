name: Self Scan

# DockSec scans its own Dockerfile and image on every change, and the build
# fails if it finds something it would tell a user to fix.
#
# This is partly a trust signal - a security tool whose maintainers do not gate
# their own merges on it is making a weaker claim than it appears to - and
# partly the most realistic regression test available: a rule that starts
# misfiring shows up here against a real file before a user reports it.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-scan:
    name: Scan DockSec's own Dockerfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install DockSec
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install scanners
        run: |
          set -euo pipefail
          TRIVY_VERSION=0.74.0
          HADOLINT_VERSION=2.15.1
          curl -fsSL -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          sudo tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
          sudo curl -fsSL -o /usr/local/bin/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          sudo chmod +x /usr/local/bin/hadolint
          trivy --version
          hadolint --version

      # Gate on HIGH so the bar is the one we would defend to a user, not a
      # lower one chosen to keep this green.
      - name: Scan our own Dockerfile
        run: |
          docksec Dockerfile --scan-only --fail-on high \
            --sarif --output-dir ./self-scan-results

      # The bundled examples are part of the product: the insecure one must
      # produce findings and the hardened one must not trip a config rule.
      #
      # "Hardened" is a statement about configuration, so that is what this
      # gates on. A CVE in a pinned upstream base image is a true positive, not
      # a rule misfiring, and gating on those would fail this job every time
      # upstream publishes an advisory against a pin the example deliberately
      # holds. Image CVEs are printed so the count stays visible.
      - name: Verify the bundled examples still behave
        if: always()
        run: |
          set -euo pipefail

          docksec --compose examples/compose/docker-compose-secure.yml --no-config \
            --scan-only --json > secure.json || true
          python3 - <<'PY'
          import json, sys
          data = json.load(open("secure.json"))
          findings = data.get("vulnerabilities", [])
          serious = [
              f for f in findings
              if str(f.get("Severity", "")).upper() in ("CRITICAL", "HIGH")
          ]
          config_findings = [
              f for f in serious
              if not str(f.get("VulnerabilityID", "")).startswith("CVE-")
          ]
          if config_findings:
              ids = ", ".join(sorted({str(f.get("VulnerabilityID")) for f in config_findings}))
              sys.exit(f"::error::the hardened example tripped config rule(s): {ids}; "
                       f"a false positive users will hit")
          cve_count = len(serious) - len(config_findings)
          print(f"hardened example: 0 config findings, "
                f"{cve_count} CRITICAL/HIGH CVE(s) in its pinned base images")
          PY

          docksec --compose examples/compose/docker-compose-insecure.yml --no-config \
            --scan-only --json > insecure.json || true
          python3 - <<'PY'
          import json, sys
          data = json.load(open("insecure.json"))
          counts = data["severity_counts"]
          if not counts.get("CRITICAL"):
              sys.exit("::error::the insecure example produced no CRITICAL findings")
          chains = data.get("exploit_chains", [])
          if not chains:
              sys.exit("::error::the insecure example produced no exploit chains")
          score = data["scan_info"]["analysis_score"]
          if score is not None and score > 25:
              sys.exit(f"::error::the insecure example scored {score}; it should score badly")
          print(f"insecure example: {counts['CRITICAL']} critical, "
                f"{len(chains)} chain(s), score {score}")
          PY

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@4e94bd11f71e507f7f87df81788dff88d1dacbfb # v4.32.3
        if: always() && hashFiles('self-scan-results/*.sarif') != ''
        with:
          sarif_file: ./self-scan-results
          category: docksec-self-scan
